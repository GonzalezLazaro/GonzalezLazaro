<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Línea de tiempo de proyectos">
  <defs><linearGradient id="tl" x1="0" x2="1"><stop offset="0" stop-color="#13306b"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs>
  <style>
    .line { stroke-dasharray: 1060; stroke-dashoffset: 1060; animation: draw 1.6s ease-out forwards; }
    .up { opacity: 0; animation: up .6s ease-out forwards; }
    .now { animation: blink 1.6s ease-in-out infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: .2; } }
  </style>
  <rect width="1200" height="210" rx="20" fill="#04060b" stroke="#1a2f5a"/>
  <line class="line" x1="70" y1="104" x2="1130" y2="104" stroke="url(#tl)" stroke-width="2"/>
  
  <g class="up" style="animation-delay:0.30s">
    <line x1="70" y1="104" x2="70" y2="86" stroke="#1a2f5a"/>
    <circle cx="70" cy="104" r="7" fill="#04060b" stroke="#60a5fa" stroke-width="2"/>
    <text x="70" y="74" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Widget</text>
    <text x="70" y="92" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11" fill="#8ba3c7">sep 2024</text>
  </g>
  <g class="up" style="animation-delay:0.55s">
    <line x1="240" y1="104" x2="240" y2="122" stroke="#1a2f5a"/>
    <circle cx="240" cy="104" r="7" fill="#04060b" stroke="#60a5fa" stroke-width="2"/>
    <text x="240" y="148" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf7">api</text>
    <text x="240" y="166" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11" fill="#8ba3c7">nov 2024</text>
  </g>
  <g class="up" style="animation-delay:0.80s">
    <line x1="410" y1="104" x2="410" y2="86" stroke="#1a2f5a"/>
    <circle cx="410" cy="104" r="7" fill="#04060b" stroke="#60a5fa" stroke-width="2"/>
    <text x="410" y="74" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf7">api-enlaces</text>
    <text x="410" y="92" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11" fill="#8ba3c7">nov 2024</text>
  </g>
  <g class="up" style="animation-delay:1.05s">
    <line x1="580" y1="104" x2="580" y2="122" stroke="#1a2f5a"/>
    <circle cx="580" cy="104" r="7" fill="#04060b" stroke="#60a5fa" stroke-width="2"/>
    <text x="580" y="148" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Encuestas-Sistemas</text>
    <text x="580" y="166" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11" fill="#8ba3c7">ene 2025</text>
  </g>
  <circle class="now" cx="1130" cy="104" r="5" fill="#93c5fd"/>
  <text x="1130" y="130" text-anchor="end" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11" fill="#60a5fa">hoy</text>
  <text x="24" y="192" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11" letter-spacing="2" fill="#4b6a9b">LANZAMIENTOS</text>
</svg>
