<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Lazaro Gonzalez — Senior Systems Analyst">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0b1f44" stroke-width="1" opacity="0.55"/></pattern>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#12306b" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#0b1f44" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#05070d" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#05070d" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#05070d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#e6edf7"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="380" rx="18"/></clipPath>
  </defs>
  <style>
    .link { stroke: #3b82f6; stroke-width: 1.4; stroke-dasharray: 6 8; opacity: .55; animation: dash 6s linear infinite; }
    .node { fill: #3b82f6; opacity: .25; animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ring { fill: none; stroke: #12306b; stroke-width: 1.2; transform-origin: 985px 190px; }
    .ring.a { stroke-dasharray: 4 10; animation: spin 40s linear infinite; }
    .ring.b { stroke-dasharray: 60 30; stroke: #3b82f6; opacity: .35; animation: spin 25s linear infinite reverse; }
    .scan { animation: scan 7s ease-in-out infinite; }
    .role { opacity: 0; animation: roles 12s infinite; }
    .r1 { animation-delay: 4s; } .r2 { animation-delay: 8s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .dot { animation: blink 2s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -140; } }
    @keyframes pulse { 0%,100% { opacity: .15; transform: scale(1); } 50% { opacity: .6; transform: scale(2.2); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes scan { 0% { transform: translateX(-400px); } 100% { transform: translateX(1300px); } }
    @keyframes roles { 0% { opacity: 0; } 4%,30% { opacity: 1; } 34%,100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="#05070d"/>
    <rect width="1200" height="380" fill="url(#g)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>
    <rect width="1200" height="380" fill="url(#fade)"/>
    <circle class="ring a" cx="985" cy="190" r="150"/>
    <circle class="ring b" cx="985" cy="190" r="118"/>
    <circle class="ring a" cx="985" cy="190" r="84"/>
    <line x1="900" y1="120" x2="1010" y2="90" class="link" style="animation-delay:0.00s"/><line x1="1010" y1="90" x2="1090" y2="170" class="link" style="animation-delay:0.35s"/><line x1="1090" y1="170" x2="985" y2="230" class="link" style="animation-delay:0.70s"/><line x1="985" y1="230" x2="880" y2="280" class="link" style="animation-delay:1.05s"/><line x1="985" y1="230" x2="1060" y2="300" class="link" style="animation-delay:1.40s"/><line x1="900" y1="120" x2="950" y2="165" class="link" style="animation-delay:1.75s"/><line x1="950" y1="165" x2="985" y2="230" class="link" style="animation-delay:2.10s"/><line x1="950" y1="165" x2="1090" y2="170" class="link" style="animation-delay:2.45s"/><line x1="880" y1="280" x2="950" y2="165" class="link" style="animation-delay:2.80s"/>
    <circle cx="900" cy="120" r="5" class="node" style="animation-delay:0.0s"/><circle cx="900" cy="120" r="2" fill="#e6edf7"/><circle cx="1010" cy="90" r="5" class="node" style="animation-delay:0.4s"/><circle cx="1010" cy="90" r="2" fill="#e6edf7"/><circle cx="1090" cy="170" r="5" class="node" style="animation-delay:0.8s"/><circle cx="1090" cy="170" r="2" fill="#e6edf7"/><circle cx="985" cy="230" r="5" class="node" style="animation-delay:1.2s"/><circle cx="985" cy="230" r="2" fill="#e6edf7"/><circle cx="880" cy="280" r="5" class="node" style="animation-delay:1.6s"/><circle cx="880" cy="280" r="2" fill="#e6edf7"/><circle cx="1060" cy="300" r="5" class="node" style="animation-delay:2.0s"/><circle cx="1060" cy="300" r="2" fill="#e6edf7"/><circle cx="950" cy="165" r="5" class="node" style="animation-delay:2.4s"/><circle cx="950" cy="165" r="2" fill="#e6edf7"/>
    <rect class="scan" x="0" y="0" width="260" height="380" fill="url(#scan)" opacity=".35"/>

    <text x="72" y="98" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" letter-spacing="4" fill="#60a5fa">HOLA, MUNDO. SOY</text>
    <text x="68" y="182" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" fill="url(#name)" letter-spacing="-1">Lazaro Gonzalez</text>
    <rect x="72" y="208" width="120" height="3" rx="1.5" fill="#3b82f6"/>
    <text class="role r0" x="72" y="268" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="22" fill="#60a5fa"><tspan fill="#4b6a9b">$ </tspan>Senior Systems Analyst</text><text class="role r1" x="72" y="268" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="22" fill="#60a5fa"><tspan fill="#4b6a9b">$ </tspan>Backend &amp; Data Engineer</text><text class="role r2" x="72" y="268" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="22" fill="#60a5fa"><tspan fill="#4b6a9b">$ </tspan>Tech Lead · Python · SQL Server · Azure</text>
    <rect class="cursor" x="72" y="286" width="12" height="3" fill="#60a5fa"/>

    <circle class="dot" cx="80" cy="330" r="5" fill="#22c55e"/>
    <text x="94" y="335" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" fill="#8ba3c7">Córdoba, Argentina  ·  abierto a colaborar</text>
    <rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="none" stroke="#1a2f5a"/>
  </g>
</svg>
