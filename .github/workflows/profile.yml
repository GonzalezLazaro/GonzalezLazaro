name: Actualizar perfil

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"
  schedule:
    - cron: "17 9 * * *" # todos los días, 06:17 en Córdoba
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar SVG (stats, lenguajes, proyectos, header)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate.py

      - name: Generar mapa de contribuciones (snake)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=#60a5fa&color_dots=#0a1224,#0e2a5c,#1d4ed8,#3b82f6,#93c5fd

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Actualizar gráficos del perfil"
          git push
